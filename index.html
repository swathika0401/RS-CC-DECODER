
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS + CC Decoder | Workspace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
        }

        .header {
            background: #111827;
            color: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
        }

        .file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin: 10px 0;
            background: #f3f4f6;
            border-radius: 10px;
        }

        .file-name {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .download {
            flex-shrink: 0;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .download:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 20px auto;
                padding: 12px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            .section {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>RS + CC DECODER</h1>
        <p>VHDL Project Workspace</p>
    </div>

    <div class="section">
        <h2>💻 VHDL Code</h2>
        <p>VHDL source files will be added here as the project develops.</p>
    </div>

    <div class="section">
        <h2>📚 Reference Material</h2>

        <div class="file">
            <span class="file-name">RS + CC Decoder Project PDF</span>
            <a class="download" href="./project.pdf" download>
                Download PDF
            </a>
        </div>
    </div>

    <div class="section">
        <h2>📝 My Documents</h2>

        <div class="file">
            <span class="file-name">Design Notes</span>
            <a class="download" href="./--%20DESIGN.txt" download>
                Download
            </a>
        </div>

        <div class="file">
            <span class="file-name">Testbench Notes</span>
            <a class="download" href="./--%20testbench.txt" download>
                Download
            </a>
        </div>
    </div>

    <footer>
        Personal VHDL Workspace
    </footer>

</div>
</body>
</html>
